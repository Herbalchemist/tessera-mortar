# Dependabot keeps Mortar's Electron and build tools, and the workflows' actions, up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
    # Electron stays on Tessera's line (Tessera's electron-version); a new major line is a tested change
    # of its own, made in both together.
    ignore:
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
