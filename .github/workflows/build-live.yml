# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Tessera USB image: the live system (Tessera, starting into Install Tessera) plus every
# Tessera build, so it installs offline. Then boots it in a virtual machine as a smoke test, and
# publishes it as a pre-release, split into parts small enough for GitHub (join them back into one ISO).
name: Build the Tessera USB image

on:
  workflow_dispatch:
    inputs:
      builds:
        description: Which Tessera builds go on the USB
        type: choice
        default: all
        options: [all, standard-only]
      release:
        description: Publish as a pre-release
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'tools/build-iso.sh'
      - 'tools/fetch-images.sh'
      - 'tools/boot-test.sh'
      - '.github/workflows/build-live.yml'

permissions:
  contents: write

concurrency:
  group: build-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      WS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Installer helper tests
        run: python3 -m unittest discover -s tests -v

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman skopeo xorriso qemu-system-x86 ovmf socat imagemagick netpbm
          df -h /

      - name: Build the live system
        run: sudo podman build --cap-add sys_admin --security-opt label=disable -t localhost/tessera-live:latest live/

      - name: Fetch the Tessera builds
        run: |
          if [ "${{ inputs.builds }}" = "standard-only" ]; then set -- tessera; else set --; fi
          sudo tools/fetch-images.sh "$WS/images" "$@"
          df -h /

      - name: Make the ISO
        run: |
          sudo tools/build-iso.sh localhost/tessera-live:latest "$WS/images" "$WS/out"
          sudo rm -rf "$WS/images"
          sudo podman rmi -a -f >/dev/null || :
          ls -la "$WS/out"; df -h /
          size=$(stat -c %s "$WS/out/Tessera-Live.iso")
          echo "::notice title=ISO size::$(awk -v s=$size 'BEGIN{printf "%.2f GB", s/1e9}')"

      - name: Boot it in a virtual machine
        continue-on-error: true
        run: |
          sudo chmod 666 /dev/kvm || :
          tools/boot-test.sh "$WS/out/Tessera-Live.iso" 300
          # Key lines from the serial console, as an annotation (job logs aren't always reachable).
          lines=$(grep -aE "tessera|livesys|gamescope|Failed|failed|error|Reached target|login:" boot-test/serial.log | tail -40 | cut -c1-160 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Boot test (serial console)::${lines:-no serial output}"
          # Screenshots go to the boot-test branch, where they can be looked at.
          mkdir -p /tmp/bt && cp boot-test/* /tmp/bt/ && tail -n 600 boot-test/serial.log > /tmp/bt/serial.log
          git config user.name "Tessera CI"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan boot-test && git rm -rq --cached . && git clean -fdq -e out
          cp /tmp/bt/* . && git add *.png serial.log && git commit -qm "Boot test for ${GITHUB_SHA::7}" && git push -qf origin boot-test

      - name: Publish as a pre-release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$WS/out"
          tag="usb-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          sha256sum Tessera-Live.iso > Tessera-Live.iso.sha256
          split -b 1900M -d -a 2 Tessera-Live.iso Tessera-Live.iso.part
          rm Tessera-Live.iso
          cat > notes.md <<'NOTES'
          **Test build of the Tessera USB image.** Not ready for everyday use yet.

          GitHub limits each file to 2 GB, so the ISO comes in parts. Download every `Tessera-Live.iso.partNN` and join them:
          - **Linux / macOS:** `cat Tessera-Live.iso.part* > Tessera-Live.iso`
          - **Windows (Command Prompt):** `copy /b Tessera-Live.iso.part00+Tessera-Live.iso.part01+... Tessera-Live.iso` (every part, in order)

          Check it with `Tessera-Live.iso.sha256`, then write it to a USB drive of 32 GB or more (balenaEtcher, Fedora Media Writer, Rufus in DD mode, or `dd`). Mortar will do all of this for you once it's ready.
          NOTES
          gh release create "$tag" --prerelease --title "Tessera USB (test) $(date -u +%Y-%m-%d)" --notes-file notes.md Tessera-Live.iso.part* Tessera-Live.iso.sha256
          echo "::notice title=Published::$tag"
