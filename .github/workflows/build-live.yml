# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the Tessera USB image: the live system (Tessera, starting into Install Tessera) plus every
# Tessera build, so it installs offline. Then boots it in a virtual machine as a smoke test, and
# publishes it as a pre-release, split into parts small enough for GitHub (join them back into one ISO).
name: Build the Tessera USB image

on:
  workflow_dispatch:
    inputs:
      builds:
        description: Which Tessera builds go on the USB
        type: choice
        default: all
        options: [all, standard-only]
      release:
        description: Publish as a pre-release
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'live/**'
      - 'tools/build-iso.sh'
      - 'tools/fetch-images.sh'
      - '.github/workflows/build-live.yml'

permissions:
  contents: write

concurrency:
  group: build-live
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      WS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash /tmp/ci-step.sh {0}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Step wrapper
        shell: bash
        run: cp tools/ci-step.sh /tmp/ci-step.sh

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Installer helper tests
        run: python3 -m unittest discover -s tests -v

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman skopeo xorriso qemu-system-x86 ovmf socat imagemagick netpbm
          df -h /

      - name: Build the live system
        run: sudo podman build --cap-add sys_admin --security-opt label=disable -t localhost/tessera-live:latest live/

      - name: Fetch the Tessera builds
        run: |
          if [ "${{ inputs.builds }}" = "standard-only" ]; then set -- tessera; else set --; fi
          sudo tools/fetch-images.sh "$WS/images" "$@"
          df -h /

      - name: Make the ISO (every build)
        run: |
          sudo SQUASH_CACHE="$WS/cache/squashfs.img" tools/build-iso.sh localhost/tessera-live:latest "$WS/images" "$WS/out"
          sudo chown -R "$(id -u):$(id -g)" "$WS/out"
          ls -la "$WS/out"; df -h /
          size=$(stat -c %s "$WS/out/Tessera-Live.iso")
          echo "::notice title=ISO size::$(awk -v s=$size 'BEGIN{printf "%.2f GB", s/1e9}')"

      - name: Boot it in a virtual machine
        continue-on-error: true
        run: |
          sudo chmod 666 /dev/kvm || :
          BOOT_ARGS=tessera.debug=1 tools/boot-test.sh "$WS/out/Tessera-Live.iso" 300
          # Key lines from the serial console, as an annotation (job logs aren't always reachable).
          lines=$(grep -aE "tessera|livesys|gamescope|Failed|failed|error|Reached target|login:" boot-test/serial.log | tail -40 | cut -c1-160 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          echo "::notice title=Boot test (serial console)::${lines:-no serial output}"
          # Screenshots go to the boot-test branch, where they can be looked at.
          mkdir -p /tmp/bt && cp boot-test/* /tmp/bt/ && tail -n 600 boot-test/serial.log > /tmp/bt/serial.log
          git config user.name "Tessera CI"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan boot-test && git rm -rq --cached . && git clean -fdq -e out -e images -e cache -e one -e none
          cp /tmp/bt/* . && git add -A . ':!out' ':!images' ':!cache' && git commit -qm "Boot test for ${GITHUB_SHA::7}" && git push -qf origin boot-test
          # back to the sources: the next step needs tools/
          git checkout -qf "$GITHUB_SHA" && git clean -fdq -e out -e images -e cache -e one -e none

      - name: Publish as a pre-release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="usb-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          # GitHub limits each file to 2 GB, so every ISO goes up in parts (Mortar joins them).
          upload() { # upload FILE (then deletes it)
            local f=$1 n; n=$(basename "$f")
            (cd "$(dirname "$f")" && sha256sum "$n" > "$n.sha256" && split -b 1900M -d -a 2 "$n" "$n.part" && rm "$n")
            gh release upload "$tag" "$f".part* "$f.sha256"
            rm -f "$f".part* "$f.sha256"
          }
          cat > notes.md <<'NOTES'
          **Test build of the Tessera USB image.** Make the USB with [Tessera Mortar](https://github.com/Herbalchemist/tessera-mortar#make-a-tessera-usb-with-mortar), which downloads, joins, checks and writes it for you.

          | Files | What's on it | USB drive |
          |---|---|---|
          | `Tessera-Live.iso.part*` | every graphics build; installs on any PC | 32 GB |
          | `Tessera-Live-amd-intel.iso.part*` | AMD / Intel only | 16 GB |
          | `Tessera-Live-nvidia.iso.part*` | NVIDIA GTX 900–1000 only | 16 GB |
          | `Tessera-Live-nvidia-open.iso.part*` | NVIDIA GTX 16 / RTX only | 16 GB |
          | `Tessera-Live-online.iso.part*` | the installer only; downloads the build while installing (needs internet then) | 8 GB |

          By hand: join the parts (`cat X.iso.part* > X.iso` on Linux, `copy /b X.iso.part00+X.iso.part01+... X.iso` on Windows), check against `X.iso.sha256`, and write with Rufus (DD mode), balenaEtcher or `dd`.
          NOTES
          gh release create "$tag" --prerelease --title "Tessera USB (test) $(date -u +%Y-%m-%d)" --notes-file notes.md
          upload "$WS/out/Tessera-Live.iso"
          # One ISO per graphics build, for USBs made for one PC (smaller drives). The live system is reused.
          for pair in tessera:amd-intel tessera-nvidia:nvidia tessera-nvidia-open:nvidia-open; do
            img=${pair%%:*} name=${pair##*:}
            sudo rm -rf "$WS/one"
            sudo skopeo copy "oci:$WS/images:$img" "oci:$WS/one:$img"
            sudo ISO_NAME="Tessera-Live-$name.iso" SQUASH_CACHE="$WS/cache/squashfs.img" tools/build-iso.sh localhost/tessera-live:latest "$WS/one" "$WS/out"
            sudo chown -R "$(id -u):$(id -g)" "$WS/out"
            echo "::notice title=Tessera-Live-$name.iso::$(stat -c %s "$WS/out/Tessera-Live-$name.iso" | awk '{printf "%.2f GB", $1/1e9}')"
            upload "$WS/out/Tessera-Live-$name.iso"
          done
          # The installer on its own, for "Online install": it downloads the build while installing.
          sudo rm -rf "$WS/none" && mkdir -p "$WS/none"
          sudo ISO_NAME="Tessera-Live-online.iso" SQUASH_CACHE="$WS/cache/squashfs.img" tools/build-iso.sh localhost/tessera-live:latest "$WS/none" "$WS/out"
          sudo chown -R "$(id -u):$(id -g)" "$WS/out"
          echo "::notice title=Tessera-Live-online.iso::$(stat -c %s "$WS/out/Tessera-Live-online.iso" | awk '{printf "%.2f GB", $1/1e9}')"
          upload "$WS/out/Tessera-Live-online.iso"
          echo "::notice title=Published::$tag"
          # Keep the three newest test builds.
          gh release list --limit 50 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | grep '^usb-' | tail -n +4 |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag || gh release delete "$old" --yes || :; done
