# SPDX-License-Identifier: GPL-3.0-or-later
# How big an offline Tessera USB has to be: reads the published images' manifests (nothing is
# downloaded) and reports their sizes, alone and together with shared layers stored once.
# A failure to read an image usually means its package isn't public yet.
name: Measure images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/measure-images.py'
      - '.github/workflows/measure-images.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install skopeo
        run: |
          command -v skopeo || (sudo apt-get update -q && sudo apt-get install -y -q skopeo)
      - name: Measure
        run: |
          python3 tools/measure-images.py \
            ghcr.io/herbalchemist/tessera:latest \
            ghcr.io/herbalchemist/tessera-nvidia:latest \
            ghcr.io/herbalchemist/tessera-nvidia-open:latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sizes
          path: sizes.json
