# SPDX-License-Identifier: GPL-3.0-or-later
# For working on the installer: builds a quick USB image (only the AMD / Intel build, light
# compression), installs it onto a virtual disk in a VM and boots the result, all in one job, without
# publishing anything. Results land on the boot-test branch.
name: Iterate on the installer

on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra kernel arguments for the live boot
        required: false
        default: 'tessera.live=desktop tessera.debug=1'

permissions:
  contents: write

concurrency:
  group: iterate
  cancel-in-progress: true

jobs:
  iterate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash /tmp/ci-step.sh {0}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Step wrapper
        shell: bash
        run: cp tools/ci-step.sh /tmp/ci-step.sh
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q podman skopeo xorriso qemu-system-x86 ovmf socat imagemagick netpbm
      - name: Build the live system
        run: sudo podman build --cap-add sys_admin --security-opt label=disable -t localhost/tessera-live:latest live/
      - name: Quick ISO (AMD / Intel build only)
        run: |
          sudo tools/fetch-images.sh "$WS/images" tessera
          sudo SQUASH_LEVEL=3 tools/build-iso.sh localhost/tessera-live:latest "$WS/images" "$WS/out"
          sudo rm -rf "$WS/images"; sudo podman rmi -a -f >/dev/null || :
          sudo chown -R "$(id -u):$(id -g)" "$WS/out"
      - name: Install in a VM and boot the result
        timeout-minutes: 100
        run: |
          sudo chmod 666 /dev/kvm || :
          BOOT_ARGS="${{ inputs.args }}" tools/install-test.sh "$WS/out/Tessera-Live.iso"
          grep -ahE "tessera-install:" install-test/serial-live.log | grep -v "log " | tail -20 | cut -c1-200 > /tmp/milestones || :
          echo "::notice title=Install milestones::$(sed 's/%/%25/g' /tmp/milestones | awk 1 ORS=%0A)"
      - name: Save the results to the boot-test branch
        if: always()
        run: |
          mkdir -p /tmp/bt
          [ -d install-test ] && cp install-test/* /tmp/bt/
          for f in /tmp/bt/*.log; do [ -f "$f" ] && tail -n 3000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          ls /tmp/bt | grep -q . || exit 0
          git config user.name "Tessera CI"; git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan boot-test && git rm -rq --cached . && git clean -fdq -e out
          cp /tmp/bt/* . && git add -A . ':!out' && git commit -qm "Iterate ${GITHUB_SHA::7}" && git push -qf origin boot-test
