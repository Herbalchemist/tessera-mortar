# Anaconda settings for installing Tessera (based on Bazzite's installer profile).
[Profile]
profile_id = tessera

[Profile Detection]
os_id = bazzite

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[Localization]
use_geolocation = False
